# Copy this file to `.github/workflows/notify-docs.yml` in every package repo.
#
# Requirements:
#   1. The package keeps its documentation in a top-level `docs/` directory
#      (markdown, optional `.navigation.yml`, and any assets referenced from it).
#   2. A repository secret `DOCS_SYNC_TOKEN`: a fine-grained PAT (or GitHub App token)
#      with "Contents: read & write" on `eienjs/docs` (required to send repository_dispatch).
name: Notify docs

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs sync
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
          PACKAGE: ${{ github.event.repository.name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api repos/eienjs/docs/dispatches \
            -f event_type=package-docs-updated \
            -f "client_payload[package]=$PACKAGE" \
            -f "client_payload[ref]=$TAG" \
            -f "client_payload[version]=$TAG"
